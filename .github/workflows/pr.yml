name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      - name: Run Biome
        run: biome ci .

  build:
    name: Build
    runs-on: ubuntu-slim

    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install NPM packages
        run: npm ci

      - name: Build Next.js
        run: |
          node --run build
          node --run postbuild

  unit-test:
    name: Unit Test
    runs-on: ubuntu-slim

    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install NPM packages
        run: npm ci

      - name: Run Unit Tests
        run: node --run test
